<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI3Football — 3D Stadium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap');

:root {
  --bg-deep: #040A04;
  --bg-panel: rgba(10,30,12,0.92);
  --green-dark: #0D3B0F;
  --green-mid: #1B5E20;
  --green-bright: #4CAF50;
  --green-neon: #00E676;
  --gold: #FFD740;
  --gold-dim: #FFA000;
  --white: #F0F4F0;
  --white-dim: #8A9A8C;
  --red: #FF1744;
  --blue-home: #2979FF;
  --orange-away: #FF6D00;
  --mono: 'Share Tech Mono', monospace;
  --display: 'Orbitron', sans-serif;
  --body: 'Rajdhani', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--white);
  font-family: var(--body);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  cursor: crosshair;
}

#canvas3d {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

/* ── Scanline overlay ── */
.scanlines {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
}

/* ── Top broadcast bar ── */
.broadcast-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 100%);
  border-bottom: 1px solid rgba(0,230,118,0.15);
}

.broadcast-bar .logo {
  font-family: var(--display);
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--green-neon);
  text-shadow: 0 0 20px rgba(0,230,118,0.4);
  display: flex;
  align-items: center;
  gap: 8px;
}

.broadcast-bar .logo .dot {
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 50%;
  animation: pulse-live 1.2s ease-in-out infinite;
  box-shadow: 0 0 8px var(--red);
}

@keyframes pulse-live {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.broadcast-bar .cam-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--white-dim);
  letter-spacing: 1px;
}

/* ── Score panel ── */
.score-panel {
  position: fixed;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: stretch;
  gap: 0;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
}

.score-team {
  padding: 8px 18px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.score-team.home {
  background: linear-gradient(135deg, rgba(41,121,255,0.9), rgba(41,121,255,0.7));
  border-radius: 4px 0 0 4px;
  border: 1px solid rgba(41,121,255,0.5);
  border-right: none;
}

.score-team.away {
  background: linear-gradient(135deg, rgba(255,109,0,0.7), rgba(255,109,0,0.9));
  border-radius: 0 4px 4px 0;
  border: 1px solid rgba(255,109,0,0.5);
  border-left: none;
}

.score-num {
  font-family: var(--display);
  font-weight: 900;
  font-size: 28px;
  min-width: 36px;
  text-align: center;
  padding: 4px 10px;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.1);
  text-shadow: 0 0 15px rgba(255,255,255,0.3);
}

.score-time {
  padding: 8px 14px;
  background: rgba(0,0,0,0.85);
  font-family: var(--mono);
  font-size: 14px;
  color: var(--green-neon);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(0,230,118,0.2);
  min-width: 60px;
}

.score-time .half {
  font-size: 9px;
  color: var(--white-dim);
  letter-spacing: 1px;
}

/* ── Camera controls ── */
.cam-controls {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  gap: 4px;
  padding: 6px 10px;
  background: var(--bg-panel);
  border: 1px solid rgba(0,230,118,0.12);
  border-radius: 6px;
  backdrop-filter: blur(10px);
}

.cam-btn {
  font-family: var(--mono);
  font-size: 10px;
  padding: 5px 8px;
  border: 1px solid rgba(0,230,118,0.15);
  background: transparent;
  color: var(--white-dim);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.2s;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.cam-btn:hover { border-color: var(--green-neon); color: var(--green-neon); }
.cam-btn.active {
  background: rgba(0,230,118,0.15);
  border-color: var(--green-neon);
  color: var(--green-neon);
  text-shadow: 0 0 8px rgba(0,230,118,0.5);
}

.cam-btn.loop-btn {
  border-color: var(--gold-dim);
  color: var(--gold);
}
.cam-btn.loop-btn.active {
  background: rgba(255,215,64,0.15);
  animation: pulse-gold 2s ease-in-out infinite;
}
@keyframes pulse-gold { 0%,100%{ box-shadow: none; } 50%{ box-shadow: 0 0 12px rgba(255,215,64,0.3); }}

/* ── Continent menu ── */
.continent-menu {
  position: fixed;
  top: 40px;
  right: 16px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.cont-btn {
  font-family: var(--body);
  font-weight: 600;
  font-size: 12px;
  padding: 6px 14px;
  border: 1px solid rgba(0,230,118,0.1);
  background: var(--bg-panel);
  color: var(--white-dim);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.25s;
  text-align: left;
  backdrop-filter: blur(8px);
}

.cont-btn:hover { border-color: var(--green-bright); color: var(--white); background: rgba(27,94,32,0.5); }
.cont-btn.active {
  border-color: var(--green-neon);
  color: var(--green-neon);
  background: rgba(0,230,118,0.08);
}

.cont-btn .flag { margin-right: 6px; font-size: 14px; }

/* ── Match info ── */
.match-info {
  position: fixed;
  top: 100px;
  right: 16px;
  z-index: 10;
  width: 180px;
  padding: 10px 12px;
  background: var(--bg-panel);
  border: 1px solid rgba(0,230,118,0.1);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--white-dim);
  line-height: 1.7;
  backdrop-filter: blur(8px);
  display: none;
}

.match-info.visible { display: block; }

.match-info .label { color: var(--green-bright); }
.match-info .val { color: var(--white); float: right; }

/* ── Stats ticker ── */
.stats-ticker {
  position: fixed;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--white-dim);
  letter-spacing: 0.5px;
  background: rgba(0,0,0,0.5);
  padding: 4px 16px;
  border-radius: 3px;
  white-space: nowrap;
}

/* ── Movement type indicator ── */
.movement-indicator {
  position: fixed;
  bottom: 80px;
  left: 16px;
  z-index: 10;
  font-family: var(--mono);
  font-size: 10px;
  padding: 8px 12px;
  background: var(--bg-panel);
  border: 1px solid rgba(0,230,118,0.1);
  border-radius: 4px;
  backdrop-filter: blur(8px);
  max-width: 200px;
}

.movement-indicator .mv-name {
  color: var(--green-neon);
  font-size: 11px;
  margin-bottom: 2px;
}

.movement-indicator .mv-force {
  color: var(--white-dim);
}

/* ── Splash / continent picker ── */
.splash-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 100;
  background: radial-gradient(ellipse at center, rgba(13,59,15,0.97) 0%, rgba(4,10,4,0.99) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s, visibility 0.8s;
}

.splash-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.splash-title {
  font-family: var(--display);
  font-weight: 900;
  font-size: 42px;
  letter-spacing: 8px;
  color: var(--green-neon);
  text-shadow: 0 0 40px rgba(0,230,118,0.3), 0 0 80px rgba(0,230,118,0.1);
  margin-bottom: 6px;
}

.splash-sub {
  font-family: var(--body);
  font-weight: 300;
  font-size: 16px;
  color: var(--white-dim);
  letter-spacing: 4px;
  margin-bottom: 50px;
}

.splash-continents {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 600px;
}

.splash-cont {
  width: 100px;
  height: 100px;
  border: 1px solid rgba(0,230,118,0.15);
  background: rgba(0,0,0,0.4);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
  gap: 8px;
}

.splash-cont:hover {
  border-color: var(--green-neon);
  background: rgba(0,230,118,0.08);
  transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(0,230,118,0.15);
}

.splash-cont .emoji { font-size: 32px; }

.splash-cont .name {
  font-family: var(--body);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--white-dim);
}

.splash-cont:hover .name { color: var(--green-neon); }

/* ── Event flash ── */
.event-flash {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  z-index: 50;
  font-family: var(--display);
  font-weight: 900;
  font-size: 64px;
  color: var(--gold);
  text-shadow: 0 0 40px rgba(255,215,64,0.5), 0 0 80px rgba(255,215,64,0.2);
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  letter-spacing: 8px;
}

.event-flash.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

// ── 18 cameras ──

// ── Simulation state ──
let gameState = {

  gameMinute: 0,
  homeGoals: 0,
  awayGoals: 0,
  ballX: 0, ballZ: 0, ballY: 0.4,

// ── Force vector engine (all math from recordings) ──
function footballHash(x, depth) {
  let val = x;
  for (let i = 0; i < depth; i++) {
    val = Math.sin(val * 1.5 + i * 0.7 + x * 0.01) * Math.cos(val * 0.618);
    val = Math.abs(val) * 0.3 + 0.25;
  }
  return val;
}

// Trig chain: cos->cos->cos->sin->sin->tan->tan->tan
function trigChain(ballLoc, sigmaLoc, softmaxLoc) {
  let v = Math.cos(Math.cos(Math.cos(ballLoc)));
  v = Math.sin(Math.sin(v * sigmaLoc));
  v = Math.tan(Math.max(-1.5, Math.min(1.5, v * softmaxLoc))) * 0.1;
  return v;
}

// Laplace zone probability
function laplaceZone(position, first) {
  if (first) return (300 - 210 * position + 5) * (2/3) * 0.001;
  return (300 - 220 * position + 4.9998) * (1/3) * 0.001;
}

// Ock-Tima goal scoring model
function ockTima(fieldPct, goalsScored) {
  const ock = Math.sin(fieldPct * Math.PI) * Math.sin(7.0 * fieldPct);
  const tima = 49 * Math.sin(fieldPct) * Math.sin(fieldPct) * Math.cos(7.0 * fieldPct);
  let base = (ock + tima) / 75.0;
  if (goalsScored > 1) base *= Math.pow(7, goalsScored) / 1155.0;
  return Math.abs(base);
}

// Pole hit probability
function poleHitProb(angle, isLeft) {
  const a = angle * Math.PI / 180;
  let p = 0.6 * Math.sin(a) * Math.cos(a) * Math.pow(Math.sin(a), 3);
  p /= (1.1 * 7.7 * 7.1 * 3.31);
  if (!isLeft) p *= (1/8) / (1/7);
  return Math.abs(p);
}

// Surface friction modifier
function surfaceModifier(surfaceType) {
  const frictions = [0.0000009999777, 0.000001234, 0.0000005, 0.0000008];
  return 1.0 + (frictions[surfaceType] || frictions[0]) * 1e6;
}

// Quadrant probability
function quadrantProb(quadrant, bx, bz) {
  const qx = [-.5, -.5, .5, .5][quadrant];
  const qz = [-.5, .5, .5, -.5][quadrant];
  const d = Math.sqrt((bx - qx) ** 2 + (bz - qz) ** 2);
  return Math.exp(-d * 1.5) * 0.6;
}

// Zone attack signal
function zoneSignal(x, y, isCenter) {
  if (isCenter) return 0.6 * Math.sin(x * Math.PI) * Math.cos(y * Math.PI);
  return x > 0.5 ? 1.4 * Math.sin(x * Math.PI) : 0.6 * Math.cos(y * Math.PI);
}

// Player switch sigmoid
function playerSwitchFactor(posHeight) {
  const base = posHeight < 0.3 ? 1.0 : posHeight > 0.7 ? 1.111 : 1.117;
  const sigmoid = 1.0 / (1.0 + Math.exp(-6.0 * (posHeight - 0.5)));
  return Math.exp(sigmoid * base * 1.1111777) / (Math.exp(sigmoid * base * 1.1111777) + Math.exp(1.0));
}

// Augustin performance ratio
function augustinCalc(ramGb, cpuCores, freqGhz) {
  const ramSigma = ramGb * Math.exp(-(freqGhz * cpuCores) / 14.031);
  const cpuMapped = cpuCores * freqGhz * (1.0 - Math.exp(-ramGb / 16.0));
  return cpuMapped / (cpuMapped + ramSigma);
}

// Terracotta thermal efficiency
function terracottaCalc(dataSizeMb, cpuTemp, passes) {
  return 0.08 * passes * (1.0 - Math.exp(-dataSizeMb / 100.0));
}

function calculateForce(moveId, behind, front) {
  const base = 0.0023 * 0.0006998 * Math.pow(0.03, 1.001234);
  const frictionLimit = 1.0 / 43.0;
  const moveFactor = (moveId < 43) ? (1.0 + moveId * frictionLimit * 0.5) : 1.0;
  const playerRatio = (front > 0) ? (1 + behind) / (1 + front) : (1 + behind);
  const forceMod = (behind > front) ? 0.0044 : 0.0004;
  const moveMod = (behind > 3) ? 1.05 : 1.044;
  return base * moveFactor * playerRatio * (1.0 + forceMod) * moveMod;
}

// Kick fraction (from lecture)
function kickFraction(kt) {
  const fracs = [0.5, 0.5, 0.1, 1.5, 0.8, 0.8];
  return fracs[kt] || 1.0;
}

function selectMovement(bx, bz, possession, behind, front, airTime) {
  const stateHash = footballHash(bx * 100.0 + bz * 50.0 + behind * 3.0 + front * 2.0 + airTime * 10.0, 6);
  const airFactor = (airTime > 2.0) ? 0.3 : 0.0;

  if (bx > 0.8) {
    const shotType = 19 + Math.floor(stateHash * 20.0) % 6;
    return (stateHash > 0.35 + airFactor) ? shotType : Math.floor(stateHash * 43.0);
  } else if (bx < 0.2) {
    return (stateHash > 0.30) ? 32 + Math.floor(stateHash * 8.0) % 8 : 5;
  } else if (bz < 0.1 || bz > 0.9) {
    return (bz < 0.1) ? 9 : 10;
  } else {
    let midType = Math.floor(stateHash * 43.0) % 18;
    const forwardBias = behind / (behind + front + 1);
    if (forwardBias > 0.5 && stateHash > 0.35) midType = 11;
    return midType;
  }
}

function getMovementBias(moveId) {
  let xBias = 0, zBias = 0;
  if (moveId <= 4 || moveId === 8 || moveId === 11 || moveId === 16) xBias = 1.0;
  else if (moveId >= 19 && moveId <= 24) xBias = 1.5;
  else if (moveId >= 5 && moveId <= 7) xBias = -0.5;
  else if (moveId >= 32 && moveId <= 39) xBias = -0.8;
  else xBias = 0.3;

  if (moveId === 3 || moveId === 9 || moveId === 17) zBias = -0.5;
  else if (moveId === 4 || moveId === 10 || moveId === 18) zBias = 0.5;

  return { xBias, zBias };
}

function simulateTick() {
  if (!gameState.running) return;
  gameState.tick++;
  gameState.gameMinute = (90.0 * gameState.tick) / 5400;

  // Countdown: 45:00 -> 00:00 per half
  const isSecondHalf = gameState.gameMinute >= 45;
  const halfMinute = isSecondHalf ? 90 - gameState.gameMinute : 45 - gameState.gameMinute;
  gameState.countdown = Math.max(0, halfMinute);
  gameState.halfLabel = isSecondHalf ? '2ND' : '1ST';

  if (gameState.gameMinute > 90) {
    gameState.running = false;
    showEvent('FULL TIME');
    return;
  }

  if (gameState.gameMinute >= 45 && !gameState.halfTime) {
    gameState.halfTime = true;
    showEvent('HALF TIME');
    // Reset positions for second half (swap sides)
    gameState.ballX = 0; gameState.ballZ = 0;
  }

  const t = gameState.tick;
  const m = Math.floor(Math.random() * 100);

  // Possession
  const possHash = footballHash(m + t * 1.3, 5);
  gameState.possession = (possHash > 0.45) ? 0 : 1;

  // Formation (1,6,7,8 patterns)
  const formations = [1, 6, 7, 8];
  const formHash = footballHash(t * 0.1 + m * 0.5, 4);
  const fi = Math.floor(formHash * 16.0) % 4;
  const behind = formations[fi];
  const front = 10 - behind;

  // Movement
  const bxNorm = (gameState.ballX + 52.5) / 105.0;
  const bzNorm = (gameState.ballZ + 34.0) / 68.0;
  const moveId = selectMovement(bxNorm, bzNorm, gameState.possession, behind, front, 0);
  gameState.moveId = moveId;

  // Force with kick type
  let force = calculateForce(moveId, behind, front);
  const kt = Math.floor(footballHash(t * 2.7 + m * 5.1, 3) * 24.0) % 6;
  force *= kickFraction(kt);
  gameState.force = force;

  // Force direction (up/down/traveler)
  const dirHash = footballHash(t * 0.9 + m * 1.7, 3);
  const forceDirMult = (dirHash > 0.45) ? 0.7 : (dirHash > 0.25) ? 0.4998 : 0.3;
  gameState.forceDir = (dirHash > 0.45) ? 'UP' : (dirHash > 0.25) ? 'TRAVELER' : 'DOWN';

  // Movement bias with all math from recordings
  const { xBias, zBias } = getMovementBias(moveId);
  const direction = (gameState.possession === 0) ? 1.0 : -1.0;

  // Trig chain modifies step intensity
  const bxNorm2 = (gameState.ballX + 52.5) / 105.0;
  const bzNorm2 = (gameState.ballZ + 34) / 68.0;
  const trigMod = 1.0 + trigChain(bxNorm2, bzNorm2, 0.5);

  // Laplace zone affects movement near goals
  const laplaceMod = 1.0 + laplaceZone(bxNorm2, bxNorm2 < 0.5) * 2.0;

  // Zone attack signal
  const zoneMod = Math.abs(zoneSignal(bxNorm2, bzNorm2, Math.abs(bxNorm2 - 0.5) < 0.15));

  // Quadrant influence
  const quad = bxNorm2 < 0.5 ? (bzNorm2 < 0.5 ? 0 : 1) : (bzNorm2 > 0.5 ? 2 : 3);
  const quadMod = 1.0 + quadrantProb(quad, bxNorm2 - 0.5, bzNorm2 - 0.5);

  // Player switch factor for possession changes
  const switchMod = playerSwitchFactor(bxNorm2);

  // Surface modifier (default natural grass)
  const surfMod = surfaceModifier(0);

  // Combined step with all math
  const baseStep = footballHash(t * 3.3 + m * 7.0, 4) * 2.0 * forceDirMult;
  const step = baseStep * trigMod * laplaceMod * (0.5 + zoneMod) * quadMod * switchMod;

  const prevX = gameState.ballX, prevZ = gameState.ballZ;
  gameState.ballX += xBias * step * direction;
  gameState.ballZ += zBias * step * (0.8 + footballHash(t * 1.7, 3) * 0.4);

  // Ock-Tima goal scoring influence near goals
  const ockInfluence = ockTima(bxNorm2, gameState.homeGoals + gameState.awayGoals);
  if (Math.abs(gameState.ballX) > 40) {
    gameState.ballX += (gameState.ballX > 0 ? 1 : -1) * ockInfluence * 3.0;
  }

  // Clamp
  gameState.ballX = Math.max(-52.5, Math.min(52.5, gameState.ballX));
  gameState.ballZ = Math.max(-34, Math.min(34, gameState.ballZ));

  // Distance
  const dx = gameState.ballX - prevX;
  const dz = gameState.ballZ - prevZ;
  gameState.totalMeters += Math.sqrt(dx * dx + dz * dz);

  // Bounce
  const tapHash = footballHash(t * 1.1 + m * 3.3, 4);
  if (moveId === 8 || moveId === 12 || moveId === 13 || moveId === 29 || moveId === 31) {
    gameState.ballY = 0.4 + tapHash * 4.0;
    gameState.bounces++;
  } else if (moveId >= 19 && moveId <= 24) {
    gameState.ballY = 0.4 + tapHash * 2.0;
  } else {
    gameState.ballY = 0.4;
  }

  // Goal check with pole/crossbar physics
  const isShot = moveId >= 19 && moveId <= 24;
  const isNearGoalR = gameState.ballX > 45;
  const isNearGoalL = gameState.ballX < -45;

  if ((isNearGoalR || isNearGoalL) && isShot) {
    const goalChance = footballHash(t * 5.0 + m * 20.0, 7);
    const shotAngle = Math.atan2(Math.abs(gameState.ballZ), isNearGoalR ? 52.5 - gameState.ballX : gameState.ballX + 52.5) * 180 / Math.PI;
    const poleProb = poleHitProb(shotAngle, gameState.ballZ < 0);
    const ockGoal = ockTima(bxNorm2, gameState.homeGoals + gameState.awayGoals);

    if (Math.abs(gameState.ballZ) < 7.32) {
      if (goalChance > 0.35 - ockGoal * 0.5) {
        if (isNearGoalR) {
          if (gameState.possession === 0) gameState.homeGoals++; else gameState.awayGoals++;
        } else {
          if (gameState.possession === 1) gameState.awayGoals++; else gameState.homeGoals++;
        }
        showEvent('GOAL!');
        gameState.ballX = 0; gameState.ballZ = 0;
      } else if (goalChance > 0.30 && poleProb > 0.001) {
        showEvent(gameState.ballZ < 0 ? 'LEFT POST!' : 'RIGHT POST!');
        gameState.ballX *= 0.8;
        gameState.ballZ *= -0.6;
      } else if (goalChance > 0.28) {
        showEvent('CROSSBAR!');
        gameState.ballY = 3.0;
        gameState.ballX *= 0.7;
      }
    } else if (Math.abs(gameState.ballZ) < 15) {
      // Wide shot
      if (goalChance > 0.65) showEvent('WIDE!');
    }
  }

  // Corner kicks when ball goes past goal line
  if (Math.abs(gameState.ballX) > 52 && !isShot) {
    const cornerSide = gameState.ballZ > 0 ? 'RIGHT' : 'LEFT';
    showEvent(cornerSide + ' CORNER');
    gameState.ballX = (gameState.ballX > 0 ? 50 : -50);
    gameState.ballZ = gameState.ballZ > 0 ? 32 : -32;
  }

  // Sideline: throw-in when ball goes out
  if (Math.abs(gameState.ballZ) > 33) {
    showEvent('THROW IN');
    gameState.ballZ = gameState.ballZ > 0 ? 32 : -32;
    gameState.possession = 1 - gameState.possession;
  } else if (Math.abs(gameState.ballZ) > 30) {
    gameState.ballZ *= 0.95;
  }

  // Offside check (attacker past last defender)
  const offsideRoll = footballHash(t * 9.1 + m * 3.3, 4);
  if (isShot && Math.abs(gameState.ballX) > 35 && offsideRoll < 0.04) {
    showEvent('OFFSIDE');
    gameState.ballX *= 0.6;
    gameState.possession = 1 - gameState.possession;
  }

  // Free kick on fouls
  if (moveId === 33 && footballHash(t * 4.4 + m * 2.2, 4) < 0.08) {
    showEvent('FREE KICK');
  }

  // Field boundary check: +2m = yellow, +5m = black card (showers)
  for (let pi = 0; pi < 11; pi++) {
    const hp = gameState.players.home[pi];
    const ap = gameState.players.away[pi];
    if (Math.abs(hp.tx) > 54.5 || Math.abs(hp.tz) > 36) {
      if (Math.abs(hp.tx) > 57.5 || Math.abs(hp.tz) > 39) {
        // Black card territory - showers hallway
        hp.tx = Math.max(-52, Math.min(52, hp.tx));
        hp.tz = Math.max(-33, Math.min(33, hp.tz));
      }
      hp.tx *= 0.95; hp.tz *= 0.95;
    }
    if (Math.abs(ap.tx) > 54.5 || Math.abs(ap.tz) > 36) {
      if (Math.abs(ap.tx) > 57.5 || Math.abs(ap.tz) > 39) {
        ap.tx = Math.max(-52, Math.min(52, ap.tx));
        ap.tz = Math.max(-33, Math.min(33, ap.tz));
      }
      ap.tx *= 0.95; ap.tz *= 0.95;
    }
  }

  // Gaming pace: speed of play (meters per tick)
  gameState.gamePace = Math.sqrt(dx * dx + dz * dz);

  // Card probability at ball position
  const distGoalNear = Math.min(
    Math.sqrt((gameState.ballX + 52.5) ** 2 + gameState.ballZ ** 2),
    Math.sqrt((gameState.ballX - 52.5) ** 2 + gameState.ballZ ** 2)
  );
  gameState.cardProbHere = distGoalNear < 5 ? 0.85 : distGoalNear < 25 ? 0.35 : 0.05;
  gameState.goalProbHere = Math.exp(-distGoalNear / 25.0) * 0.6;

  // Card events (yellow/red based on proximity and tackles)
  if (moveId === 33 || moveId === 34) { // tackle or intercept
    const cardRoll = footballHash(t * 11.1 + m * 7.7, 5);
    if (cardRoll < gameState.cardProbHere * 0.15) {
      if (distGoalNear < 5) {
        gameState.redCards++;
        showEvent('RED CARD!');
      } else {
        gameState.yellowCards++;
        showEvent('YELLOW CARD');
      }
    }
  }

  // Move players
  updatePlayers(t, m);
}

function updatePlayers(t, m) {
  for (let i = 0; i < 11; i++) {
    const hh = footballHash(t * 0.3 + i * 7.7 + m * 0.1, 3);
    const ha = footballHash(t * 0.3 + i * 7.7 + m * 0.1 + 500, 3);

    // Home players chase ball with formation offsets
    const hBallPull = (i < 2) ? 0.15 : (i < 5) ? 0.4 : (i < 9) ? 0.55 : 0.7;
    const hTarget = gameState.ballX * hBallPull + (i - 5) * 6 + (hh - 0.4) * 10;
    const hTargetZ = gameState.ballZ * hBallPull + (hh - 0.5) * 20 + (i % 2 === 0 ? -3 : 3);
    gameState.players.home[i].tx = Math.max(-50, Math.min(10, hTarget));
    gameState.players.home[i].tz = Math.max(-32, Math.min(32, hTargetZ));

    // Away players chase ball
    const aBallPull = (i < 2) ? 0.15 : (i < 5) ? 0.4 : (i < 9) ? 0.55 : 0.7;
    const aTarget = gameState.ballX * aBallPull - (i - 5) * 6 + (ha - 0.4) * 10;
    const aTargetZ = gameState.ballZ * aBallPull + (ha - 0.5) * 20 + (i % 2 === 0 ? 3 : -3);
    gameState.players.away[i].tx = Math.max(-10, Math.min(50, aTarget));
    gameState.players.away[i].tz = Math.max(-32, Math.min(32, aTargetZ));
  }
}

const spectatorMeshes = [];

function createStand(x, z, width, depth, rot) {
  const standGroup = new THREE.Group();
  const rows = 8;
  for (let r = 0; r < rows; r++) {
    const stepGeo = new THREE.BoxGeometry(width, 0.8, depth / rows);
    const stepMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.0, 0.0, 0.15 + r * 0.03),
      roughness: 0.9
    });
    const step = new THREE.Mesh(stepGeo, stepMat);
    step.position.set(0, r * 0.8 + 0.4, r * (depth / rows) * 0.5);
    standGroup.add(step);

    // Spectators with body + head
    const specCount = Math.floor(width / 1.2);
    for (let d = 0; d < specCount; d++) {
      const specGroup = new THREE.Group();
      const hue = Math.random();
      const shirtColor = new THREE.Color().setHSL(hue, 0.6, 0.45);
      // Body
      const bodyGeo = new THREE.CylinderGeometry(0.15, 0.18, 0.5, 5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.8 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.25;
      specGroup.add(body);
      // Head
      const headGeo = new THREE.SphereGeometry(0.12, 5, 4);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.8 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 0.6;
      specGroup.add(head);

      const sx = -width/2 + d * 1.2 + Math.random() * 0.4;
      const sy = r * 0.8 + 0.8;
      const sz = r * (depth/rows) * 0.5;
      specGroup.position.set(sx, sy, sz);
      standGroup.add(specGroup);
      spectatorMeshes.push(specGroup);
    }
  }

  standGroup.position.set(x, 0, z);
  standGroup.rotation.y = rot;
  scene.add(standGroup);
  return standGroup;
}

    const ctx = b.canvas.getContext('2d');
    ctx.fillStyle = '#050F05';
    ctx.fillRect(0, 0, 1024, 64);
    ctx.fillStyle = '#00E676';
    ctx.font = 'bold 28px monospace';
    const fullText = scrollTexts.join('    ///    ');
    const textW = ctx.measureText(fullText).width;
    const xPos = 1024 - ((scrollOffset + b.idx * 200) % (textW + 1024));
    ctx.fillText(fullText, xPos, 44);
    b.tex.needsUpdate = true;
  });
}

  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.4 });

// Update referee position (follows ball, stays offset)
function updateReferee() {
  const offset = footballHash(gameState.tick * 0.7, 3) * 15 - 7;
  refereeTarget.tx = gameState.ballX * 0.7 + offset;
  refereeTarget.tz = gameState.ballZ * 0.5 + 8 + (footballHash(gameState.tick * 1.1, 3) - 0.4) * 10;
  refereeTarget.tx = Math.max(-50, Math.min(50, refereeTarget.tx));
  refereeTarget.tz = Math.max(-32, Math.min(32, refereeTarget.tz));

  refereeMesh.position.x += (refereeTarget.tx - refereeMesh.position.x) * 0.06;
  refereeMesh.position.z += (refereeTarget.tz - refereeMesh.position.z) * 0.06;
  const rdx = refereeTarget.tx - refereeMesh.position.x;
  const rdz = refereeTarget.tz - refereeMesh.position.z;
  if (Math.abs(rdx) + Math.abs(rdz) > 0.3) {
    refereeMesh.rotation.y = Math.atan2(rdx, rdz);
    if (refereeMesh.userData.lLeg) {
      refereeMesh.userData.lLeg.rotation.x = Math.sin(Date.now() * 0.006) * 0.3;
      refereeMesh.userData.rLeg.rotation.x = -Math.sin(Date.now() * 0.006) * 0.3;
    }
  }
  refereeLabel.position.set(refereeMesh.position.x, 2.5, refereeMesh.position.z);
}

// Full position-influence recalculation
// Every entity's numbers depend on ALL other entities' positions
function updateCardRisks() {
  // Collect all positions: 11 home + 11 away + referee + ball
  const allPos = [];
  for (let i = 0; i < 11; i++) {
    allPos.push({ x: playerMeshes.home[i].position.x, z: playerMeshes.home[i].position.z, team: 'H', idx: i });
    allPos.push({ x: playerMeshes.away[i].position.x, z: playerMeshes.away[i].position.z, team: 'A', idx: i });
  }
  allPos.push({ x: refereeMesh.position.x, z: refereeMesh.position.z, team: 'R', idx: 0 });
  const ballPos = { x: gameState.ballX, z: gameState.ballZ };

  // Count nearby players for each entity (crowding increases card risk)
  function countNearby(px, pz, radius) {
    let count = 0;
    allPos.forEach(p => {
      const d = Math.sqrt((p.x - px) ** 2 + (p.z - pz) ** 2);
      if (d < radius && d > 0.5) count++;
    });
    return count;
  }

  for (let i = 0; i < 11; i++) {
    // HOME PLAYER - influenced by all positions
    const hm = playerMeshes.home[i];
    const hDistGoal = Math.sqrt((hm.position.x - 52.5) ** 2 + hm.position.z ** 2);
    const hDistBall = Math.sqrt((hm.position.x - ballPos.x) ** 2 + (hm.position.z - ballPos.z) ** 2);
    const hDistRef = Math.sqrt((hm.position.x - refereeMesh.position.x) ** 2 + (hm.position.z - refereeMesh.position.z) ** 2);
    const hNearby = countNearby(hm.position.x, hm.position.z, 8);
    const hGoalieDistToMe = Math.sqrt((hm.position.x - playerMeshes.away[0].position.x) ** 2 + (hm.position.z - playerMeshes.away[0].position.z) ** 2);

    // Card risk = f(goal distance, nearby players, referee distance, goalie proximity)
    const hBaseRisk = Math.exp(-hDistGoal / 15.0);
    const hCrowdMod = 1.0 + hNearby * 0.08;
    const hRefMod = hDistRef < 15 ? 1.3 : 1.0;
    const hGoalieMod = Math.exp(-hGoalieDistToMe / 20.0);
    const hRisk = Math.min(0.99, hBaseRisk * hCrowdMod * hRefMod * (1 + hGoalieMod));
    const hCardType = hDistGoal < 5 ? 'R' : hDistGoal < 25 ? 'Y' : '-';

    const hcr = cardRiskLabels.home[i];
    const hc = hcr.userData.canvas;
    const hctx = hc.getContext('2d');
    hctx.clearRect(0, 0, 128, 48);
    hctx.fillStyle = hCardType === 'R' ? '#ff3333' : hCardType === 'Y' ? '#ffcc00' : '#44ff44';
    hctx.font = 'bold 10px monospace';
    hctx.textAlign = 'center';
    hctx.fillText(hCardType + ':' + (hRisk * 100).toFixed(0) + '% n:' + hNearby, 64, 14);
    hctx.fillStyle = '#aaaaaa';
    hctx.font = '9px monospace';
    hctx.fillText('g:' + hDistGoal.toFixed(0) + ' b:' + hDistBall.toFixed(0) + ' r:' + hDistRef.toFixed(0), 64, 28);
    hcr.userData.tex.needsUpdate = true;
    hcr.position.set(hm.position.x, 1.6, hm.position.z);

    // AWAY PLAYER - same calculation mirrored
    const am = playerMeshes.away[i];
    const aDistGoal = Math.sqrt((am.position.x + 52.5) ** 2 + am.position.z ** 2);
    const aDistBall = Math.sqrt((am.position.x - ballPos.x) ** 2 + (am.position.z - ballPos.z) ** 2);
    const aDistRef = Math.sqrt((am.position.x - refereeMesh.position.x) ** 2 + (am.position.z - refereeMesh.position.z) ** 2);
    const aNearby = countNearby(am.position.x, am.position.z, 8);
    const aGoalieDistToMe = Math.sqrt((am.position.x - playerMeshes.home[0].position.x) ** 2 + (am.position.z - playerMeshes.home[0].position.z) ** 2);

    const aBaseRisk = Math.exp(-aDistGoal / 15.0);
    const aCrowdMod = 1.0 + aNearby * 0.08;
    const aRefMod = aDistRef < 15 ? 1.3 : 1.0;
    const aGoalieMod = Math.exp(-aGoalieDistToMe / 20.0);
    const aRisk = Math.min(0.99, aBaseRisk * aCrowdMod * aRefMod * (1 + aGoalieMod));
    const aCardType = aDistGoal < 5 ? 'R' : aDistGoal < 25 ? 'Y' : '-';

    const acr = cardRiskLabels.away[i];
    const ac = acr.userData.canvas;
    const actx = ac.getContext('2d');
    actx.clearRect(0, 0, 128, 48);
    actx.fillStyle = aCardType === 'R' ? '#ff3333' : aCardType === 'Y' ? '#ffcc00' : '#44ff44';
    actx.font = 'bold 10px monospace';
    actx.textAlign = 'center';
    actx.fillText(aCardType + ':' + (aRisk * 100).toFixed(0) + '% n:' + aNearby, 64, 14);
    actx.fillStyle = '#aaaaaa';
    actx.font = '9px monospace';
    actx.fillText('g:' + aDistGoal.toFixed(0) + ' b:' + aDistBall.toFixed(0) + ' r:' + aDistRef.toFixed(0), 64, 28);
    acr.userData.tex.needsUpdate = true;
    acr.position.set(am.position.x, 1.6, am.position.z);
  }
}

// ── Animation loop ──
let lastSimTime = 0;
const SIM_INTERVAL = 1000; // 1 tick per second, real-time 90 min (5400 ticks)

function animate(time) {
  requestAnimationFrame(animate);

  // Simulation tick
  if (time - lastSimTime > SIM_INTERVAL && gameState.running) {
    simulateTick();
    lastSimTime = time;
  }

  // Smooth ball movement (follow the play)
  ball.position.x += (gameState.ballX - ball.position.x) * 0.1;
  ball.position.z += (gameState.ballZ - ball.position.z) * 0.1;
  ball.position.y += (gameState.ballY - ball.position.y) * 0.12;
  ball.rotation.x += 0.05;
  ball.rotation.z += 0.03;

  // Smooth player movement with leg animation and name labels
  for (let i = 0; i < 11; i++) {
    const hm = playerMeshes.home[i];
    const hp = gameState.players.home[i];
    const hDx = hp.tx - hm.position.x;
    const hDz = hp.tz - hm.position.z;
    hm.position.x += hDx * 0.08;
    hm.position.z += hDz * 0.08;
    // Face direction of movement
    if (Math.abs(hDx) + Math.abs(hDz) > 0.5) {
      hm.rotation.y = Math.atan2(hDx, hDz);
    }
    // Leg animation (running)
    const hSpeed = Math.sqrt(hDx * hDx + hDz * hDz);
    if (hm.userData.lLeg && hSpeed > 0.3) {
      hm.userData.lLeg.rotation.x = Math.sin(time * 0.008 + i) * 0.4;
      hm.userData.rLeg.rotation.x = -Math.sin(time * 0.008 + i) * 0.4;
    }
    // Name label follows player
    playerLabels.home[i].position.set(hm.position.x, 2.5, hm.position.z);

    const am = playerMeshes.away[i];
    const ap = gameState.players.away[i];
    const aDx = ap.tx - am.position.x;
    const aDz = ap.tz - am.position.z;
    am.position.x += aDx * 0.08;
    am.position.z += aDz * 0.08;
    if (Math.abs(aDx) + Math.abs(aDz) > 0.5) {
      am.rotation.y = Math.atan2(aDx, aDz);
    }
    if (am.userData.lLeg && Math.sqrt(aDx * aDx + aDz * aDz) > 0.3) {
      am.userData.lLeg.rotation.x = Math.sin(time * 0.008 + i + 3) * 0.4;
      am.userData.rLeg.rotation.x = -Math.sin(time * 0.008 + i + 3) * 0.4;
    }
    playerLabels.away[i].position.set(am.position.x, 2.5, am.position.z);
  }

  // Update scrolling ad boards
  updateScrollBoards();

  // Update live probability numbers on field
  updateLiveOdds();

  // Referee follows play
  updateReferee();

  // Card risk per player (distance to goalie exponent)
  updateCardRisks();

  // Crowd wave animation (subtle swaying)
  for (let s = 0; s < spectatorMeshes.length; s += 4) {
    const spec = spectatorMeshes[s];
    if (spec) {
      spec.position.y += Math.sin(time * 0.002 + s * 0.3) * 0.001;
      spec.rotation.z = Math.sin(time * 0.001 + s * 0.5) * 0.05;
    }
  }

  // Camera
  if (gameState.camLoop) {
    gameState.camLoopTimer += 0.005;
    if (gameState.camLoopTimer > 1) {
      gameState.camLoopTimer = 0;
      const next = (gameState.currentCam + 1) % CAMERAS.length;
      switchCamera(next);
    }
  }

  const cam = CAMERAS[gameState.currentCam];
  const targetPos = new THREE.Vector3(...cam.pos);
  const targetLook = new THREE.Vector3(...cam.look);

  camera.position.lerp(targetPos, 0.03);
  const currentLook = new THREE.Vector3();
  camera.getWorldDirection(currentLook);
  camera.lookAt(targetLook);

  // Update UI
  if (gameState.running || gameState.tick > 0) {
    const cd = gameState.countdown || 0;
    const cdMins = Math.floor(cd);
    const cdSecs = Math.floor((cd % 1) * 60);
    document.getElementById('matchTime').textContent = `${cdMins.toString().padStart(2, '0')}:${cdSecs.toString().padStart(2, '0')}`;
    document.getElementById('halfLabel').textContent = gameState.halfLabel || '1ST';
    document.getElementById('homeScore').textContent = gameState.homeGoals;
    document.getElementById('awayScore').textContent = gameState.awayGoals;

    document.getElementById('mvName').textContent = MOVE_NAMES[gameState.moveId] || 'UNIFORM';
    document.getElementById('mvForce').textContent = `F: ${gameState.force.toExponential(4)}`;

    document.getElementById('infoBallSpd').textContent = `${(gameState.force * 1e6).toFixed(1)}`;
    document.getElementById('infoPossess').textContent = gameState.possession === 0 ? gameState.homeName : gameState.awayName;
    document.getElementById('infoForce').textContent = gameState.forceDir;
    document.getElementById('infoMove').textContent = `#${gameState.moveId}`;

    document.getElementById('statsTicker').textContent =
      `TICKS: ${gameState.tick} | DIST: ${Math.floor(gameState.totalMeters)}m | PACE: ${(gameState.gamePace * 60).toFixed(1)} | GOAL: ${(gameState.goalProbHere * 100).toFixed(0)}% | CARD: ${(gameState.cardProbHere * 100).toFixed(0)}% | YC: ${gameState.yellowCards} RC: ${gameState.redCards} | ${MOVE_NAMES[gameState.moveId]}`;
  }

  // Ball glow pulse
  glowMat.opacity = 0.1 + Math.sin(time * 0.003) * 0.05;

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// ── Live probability sprites on field (always visible during play) ──
const liveOddsGroup = new THREE.Group();
scene.add(liveOddsGroup);
const liveOddsSprites = [];
const LIVE_GRID = 10;

function makeLiveLabel() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 48;
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.8 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(3.5, 1.2, 1);
  sprite.userData = { canvas: c, tex: tex };
  return sprite;
}

// Create grid of live odds sprites
for (let gx = -50; gx <= 50; gx += LIVE_GRID) {
  for (let gz = -30; gz <= 30; gz += LIVE_GRID) {
    const sprite = makeLiveLabel();
    sprite.position.set(gx, 0.4, gz);
    liveOddsGroup.add(sprite);
    liveOddsSprites.push({ sprite, baseX: gx, baseZ: gz });
  }
}

// Per-player force/direction labels
const playerForceLabels = { home: [], away: [] };
for (let i = 0; i < 11; i++) {
  const hf = makeLiveLabel();
  hf.scale.set(3, 0.8, 1);
  scene.add(hf);
  playerForceLabels.home.push(hf);
  const af = makeLiveLabel();
  af.scale.set(3, 0.8, 1);
  scene.add(af);
  playerForceLabels.away.push(af);
}

// Gaming pace display sprite
const paceSprite = makeLiveLabel();
paceSprite.scale.set(8, 1.5, 1);
paceSprite.position.set(0, 4, -33);
scene.add(paceSprite);

function updateLiveOdds() {
  if (!gameState.running && gameState.tick === 0) return;

  // Update odds at each grid point based on current ball position
  liveOddsSprites.forEach(item => {
    const { sprite, baseX, baseZ } = item;
    const c = sprite.userData.canvas;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 128, 48);

    // Calculate live odds relative to ball
    const distBall = Math.sqrt((baseX - gameState.ballX) ** 2 + (baseZ - gameState.ballZ) ** 2);
    const distGoalL = Math.sqrt((baseX + 52.5) ** 2 + baseZ * baseZ);
    const distGoalR = Math.sqrt((baseX - 52.5) ** 2 + baseZ * baseZ);
    const distGoal = Math.min(distGoalL, distGoalR);

    const goalP = (Math.exp(-distGoal / 25.0) * 60).toFixed(0);
    const cardP = distGoal < 5 ? '85' : distGoal < 25 ? '35' : '5';
    const action = distBall < 15 ? (Math.exp(-distBall / 10) * 100).toFixed(0) : '';

    // Color by zone
    const isRed = distGoal < 8;
    const isYellow = distGoal < 25;
    ctx.fillStyle = isRed ? '#ff3333' : isYellow ? '#ffcc00' : '#00dd66';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(goalP + '%', 64, 16);

    // Show action probability near ball
    if (action) {
      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace';
      ctx.fillText('A:' + action, 64, 32);
    }

    // Card probability
    ctx.fillStyle = isRed ? '#ff6666' : '#ffaa00';
    ctx.font = '10px monospace';
    ctx.fillText('C:' + cardP, 64, 44);

    sprite.userData.tex.needsUpdate = true;
  });

  // Update per-player force labels
  for (let i = 0; i < 11; i++) {
    const hm = playerMeshes.home[i];
    const hfl = playerForceLabels.home[i];
    const hc = hfl.userData.canvas;
    const hctx = hc.getContext('2d');
    hctx.clearRect(0, 0, 128, 48);
    const hDist = Math.sqrt((hm.position.x - gameState.ballX) ** 2 + (hm.position.z - gameState.ballZ) ** 2);
    const hForce = (gameState.force * 1e6 * Math.exp(-hDist / 30)).toFixed(1);
    hctx.fillStyle = '#6699ff';
    hctx.font = 'bold 12px monospace';
    hctx.textAlign = 'center';
    hctx.fillText('F:' + hForce, 64, 16);
    hctx.fillStyle = '#aaccff';
    hctx.font = '10px monospace';
    hctx.fillText('d:' + hDist.toFixed(0) + 'm', 64, 32);
    hfl.userData.tex.needsUpdate = true;
    hfl.position.set(hm.position.x, 2.2, hm.position.z);

    const am = playerMeshes.away[i];
    const afl = playerForceLabels.away[i];
    const ac = afl.userData.canvas;
    const actx = ac.getContext('2d');
    actx.clearRect(0, 0, 128, 48);
    const aDist = Math.sqrt((am.position.x - gameState.ballX) ** 2 + (am.position.z - gameState.ballZ) ** 2);
    const aForce = (gameState.force * 1e6 * Math.exp(-aDist / 30)).toFixed(1);
    actx.fillStyle = '#ff9944';
    actx.font = 'bold 12px monospace';
    actx.textAlign = 'center';
    actx.fillText('F:' + aForce, 64, 16);
    actx.fillStyle = '#ffcc88';
    actx.font = '10px monospace';
    actx.fillText('d:' + aDist.toFixed(0) + 'm', 64, 32);
    afl.userData.tex.needsUpdate = true;
    afl.position.set(am.position.x, 2.2, am.position.z);
  }

  // Gaming pace display with all formula outputs
  const pc = paceSprite.userData.canvas;
  const pctx = pc.getContext('2d');
  pctx.clearRect(0, 0, 128, 48);
  pctx.fillStyle = '#00ffaa';
  pctx.font = 'bold 11px monospace';
  pctx.textAlign = 'center';
  const pace = (gameState.gamePace * 60).toFixed(1);
  const gp = (gameState.goalProbHere * 100).toFixed(0);
  const cp = (gameState.cardProbHere * 100).toFixed(0);
  const bxN = (gameState.ballX + 52.5) / 105;
  const ock = (ockTima(bxN, gameState.homeGoals + gameState.awayGoals) * 100).toFixed(1);
  const aug = augustinCalc(64, 16, 3.5).toFixed(3);
  pctx.fillText('PACE:' + pace + ' G:' + gp + '% C:' + cp + '% Ock:' + ock + ' Aug:' + aug, 64, 16);
  pctx.fillStyle = '#88ffcc';
  pctx.font = '9px monospace';
  pctx.fillText('#' + gameState.moveId + ' ' + gameState.forceDir + ' YC:' + gameState.yellowCards + ' RC:' + gameState.redCards + ' Lp:' + laplaceZone(bxN, true).toFixed(2), 64, 34);
  paceSprite.userData.tex.needsUpdate = true;
}

// ── Dev View (Shift+2) - odds at every spot on field ──
let devViewActive = false;
const devGroup = new THREE.Group();
devGroup.visible = false;
scene.add(devGroup);

// Surface type label
const surfaceNames = ['Natural Grass South Africa','Plastix Tex-Tex Glassi Glasgow','Semi-Grass Edinburgh','Table Indoor','Blank Key'];
let currentSurface = 0;

// Probability at each field position
function fieldOdds(fx, fz) {
  const distGoalL = Math.sqrt((fx + 52.5) * (fx + 52.5) + fz * fz);
  const distGoalR = Math.sqrt((fx - 52.5) * (fx - 52.5) + fz * fz);
  const distMin = Math.min(distGoalL, distGoalR);
  const goalProb = Math.exp(-distMin / 25.0) * 0.6;
  const cardProb = (distMin < 5) ? 0.85 : (distMin < 25) ? 0.35 : 0.05;
  const zone = (Math.abs(fx) < 20) ? 0.6 : (fx > 0 ? 1.4 : 0.6);
  const laplace = (300 - 210 * Math.abs(fx / 52.5) + 5) * (2/3) * 0.001;
  const total = goalProb * zone * (1 + laplace);
  return { goal: goalProb, card: cardProb, zone: zone, total: total };
}

function makeOddsLabel(text, color) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 32;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(text, 64, 22);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.9 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4, 1, 1);
  return sprite;
}

// Grid of odds numbers across the pitch
function buildDevView() {
  while (devGroup.children.length > 0) devGroup.remove(devGroup.children[0]);

  // Dense odds numbers across entire field (every 6m)
  for (let gx = -50; gx <= 50; gx += 6) {
    for (let gz = -30; gz <= 30; gz += 6) {
      const odds = fieldOdds(gx, gz);
      const val = (odds.total * 100).toFixed(1);
      const color = odds.card > 0.5 ? '#ff4444' : odds.card > 0.2 ? '#ffcc00' : '#00ff88';
      const label = makeOddsLabel(val, color);
      label.position.set(gx, 0.3, gz);
      label.scale.set(3, 0.7, 1);
      devGroup.add(label);
    }
  }

  // Foul severity numbers (smaller, between odds)
  for (let gx = -47; gx <= 47; gx += 12) {
    for (let gz = -27; gz <= 27; gz += 12) {
      const dist = Math.min(Math.sqrt((gx+52.5)*(gx+52.5)+gz*gz), Math.sqrt((gx-52.5)*(gx-52.5)+gz*gz));
      const sev = dist < 5 ? '180' : dist < 15 ? '170' : dist < 25 ? '165' : dist < 35 ? '145' : '133';
      const sevLabel = makeOddsLabel('S:'+sev, '#ff8844');
      sevLabel.position.set(gx, 0.6, gz);
      sevLabel.scale.set(2.5, 0.6, 1);
      devGroup.add(sevLabel);
    }
  }

  // Card zone labels at key spots
  const keyLabels = [
    { x: -48, z: 0, text: 'RED x3', col: '#ff2222' },
    { x: 48, z: 0, text: 'RED x3', col: '#ff2222' },
    { x: -35, z: 0, text: 'YEL x2', col: '#ffcc00' },
    { x: 35, z: 0, text: 'YEL x2', col: '#ffcc00' },
    { x: 0, z: 0, text: 'CENTER 35%', col: '#00ff88' },
    { x: -25, z: -20, text: 'Q1 1/7', col: '#44aaff' },
    { x: -25, z: 20, text: 'Q2 3/5', col: '#44aaff' },
    { x: 25, z: 20, text: 'Q3 7/5', col: '#44aaff' },
    { x: 25, z: -20, text: 'Q4 3/5', col: '#44aaff' },
    { x: 0, z: -28, text: 'Laplace A: 300,210,5', col: '#88ffaa' },
    { x: 0, z: 28, text: 'Laplace B: 300,220,5', col: '#88ffaa' },
  ];
  keyLabels.forEach(kl => {
    const s = makeOddsLabel(kl.text, kl.col);
    s.position.set(kl.x, 1.5, kl.z);
    s.scale.set(6, 1.2, 1);
    devGroup.add(s);
  });

  // Trajectory lines (red = high card risk paths, yellow = movement paths)
  const redLineMat = new THREE.LineBasicMaterial({ color: 0xff2222, transparent: true, opacity: 0.6 });
  const yellowLineMat = new THREE.LineBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.5 });

  for (let t = 0; t < 12; t++) {
    const pts = [];
    const isRed = t < 5;
    let px = -50 + t * 8, pz = -25 + (t % 3) * 15;
    for (let s = 0; s < 20; s++) {
      const h = footballHash(t * 13.7 + s * 3.3, 3);
      px += (h - 0.3) * 8;
      pz += (h - 0.5) * 6;
      px = Math.max(-52, Math.min(52, px));
      pz = Math.max(-33, Math.min(33, pz));
      pts.push(new THREE.Vector3(px, 0.15 + Math.sin(s * 0.5) * 0.3, pz));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    devGroup.add(new THREE.Line(geo, isRed ? redLineMat : yellowLineMat));
  }

  // Surface type label
  const surfLabel = makeOddsLabel(surfaceNames[currentSurface], '#00ffaa');
  surfLabel.position.set(0, 3, -32);
  surfLabel.scale.set(12, 2, 1);
  surfLabel.name = 'surfaceLabel';
  devGroup.add(surfLabel);

  // Footer bar
  const footer = makeOddsLabel('SHIFT+2 DEV | 893 tests | Augustin 0.9789 | Terracotta 1050C | 70K bets/s | TCP 3.99', '#00ff88');
  footer.position.set(0, 0.5, 35);
  footer.scale.set(30, 1.5, 1);
  devGroup.add(footer);
}

buildDevView();

// Cycle surface type with Shift+3
window.addEventListener('keydown', (e) => {
  if (e.shiftKey && (e.key === '@' || e.key === '2')) {
    devViewActive = !devViewActive;
    devGroup.visible = devViewActive;
  }
  if (e.shiftKey && (e.key === '#' || e.key === '3') && devViewActive) {
    currentSurface = (currentSurface + 1) % surfaceNames.length;
    buildDevView();
  }
});

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
